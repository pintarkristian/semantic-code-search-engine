name: CI

on:
  push:
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"

jobs:
  test:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy semcode

      - name: Fast tests with coverage
        env:
          DATA_DIR: ${{ runner.temp }}/semcode-data
          FAISS_INDEX_PATH: ${{ runner.temp }}/semcode-data/index.faiss
          METADATA_PATH: ${{ runner.temp }}/semcode-data/metadata.parquet
          RERANKER_MODEL_PATH: ${{ runner.temp }}/semcode-data/reranker
        run: python -m pytest -q
