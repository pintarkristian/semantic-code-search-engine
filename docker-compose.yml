services:
  semcode:
    build:
      context: .
    image: semcode:latest
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /app/data
      FAISS_INDEX_PATH: /app/data/index.faiss
      METADATA_PATH: /app/data/metadata.parquet
      RERANKER_MODEL_PATH: /app/data/reranker
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles:
      - qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
